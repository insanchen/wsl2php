<VirtualHost *:80>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__
    Redirect permanent / https://__SERVER_NAME__/
</VirtualHost>

<VirtualHost *:443>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__
    DocumentRoot __SERVER_ROOT__/__SERVER_APP__

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/__SERVER_NAME__.crt
    SSLCertificateKeyFile /etc/apache2/ssl/__SERVER_NAME__.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory __SERVER_ROOT__/__SERVER_APP__>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/__SERVER_NAME__-error.log
    CustomLog ${APACHE_LOG_DIR}/__SERVER_NAME__-access.log combined
</VirtualHost>
