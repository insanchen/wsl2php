server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__ __SERVER_ALIAS__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl __HTTP2_LISTEN__;
    listen [::]:443 ssl __HTTP2_LISTEN__;
    __HTTP2_DIRECTIVE__
    server_name __SERVER_NAME__ __SERVER_ALIAS__;
    root __SERVER_ROOT__/__SERVER_APP__;
    index index.php index.html;

    ssl_certificate /etc/nginx/ssl/__SERVER_NAME__.crt;
    ssl_certificate_key /etc/nginx/ssl/__SERVER_NAME__.key;
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/__SERVER_NAME__.access.log;
    error_log /var/log/nginx/__SERVER_NAME__.error.log warn;
    include conf-security.conf;
    __PMA_INCLUDE__

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include conf-fastcgi.conf;
        fastcgi_pass unix:__PHP_SOCKET__;
    }
}
